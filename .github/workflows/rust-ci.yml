name: Rust CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust (versión fija)
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Formato — make fmt
        run: make fmt

      - name: Lint — make clippy
        run: make clippy

      - name: Compilar release — make build
        run: make build

      - name: Comprobar binarios de release
        run: test -x target/release/speedyG && test -x target/release/speedyg

      - name: Pruebas unitarias — make test
        run: make test

      - name: Ejecutar casos de verificación — make run-all
        run: make run-all

      - name: Subir evidencias de verificación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verif-results
          path: verif/results/

      - name: Detectar procesos speedyG huérfanos
        if: always()
        run: |
          ORPHANS=$(pgrep -x speedyG || true)
          if [[ -n "$ORPHANS" ]]; then
            echo "Procesos speedyG huérfanos detectados: $ORPHANS"
            kill $ORPHANS 2>/dev/null || true
            exit 1
          fi
          echo "Sin procesos speedyG huérfanos."