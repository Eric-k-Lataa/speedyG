name: Rust CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust (versión fija)
        uses: dtolnay/rust-toolchain@1.81.0
        with:
          components: rustfmt, clippy

      - name: Formato — cargo fmt
        run: cargo fmt --check

      - name: Lint — cargo clippy
        run: cargo clippy -- -D warnings

      - name: Compilar binarios
        run: cargo build --bins

      - name: Pruebas unitarias
        run: cargo test

      - name: Ejecutar casos de verificación
        run: bash verif/scripts/run-all.sh

      - name: Subir evidencias de verificación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verif-results
          path: verif/results/

      - name: Detectar procesos speedyG huérfanos
        if: always()
        run: |
          ORPHANS=$(pgrep -x speedyG || true)
          if [[ -n "$ORPHANS" ]]; then
            echo "Procesos speedyG huérfanos detectados: $ORPHANS"
            kill $ORPHANS 2>/dev/null || true
            exit 1
          fi
          echo "Sin procesos speedyG huérfanos."